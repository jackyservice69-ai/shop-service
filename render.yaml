services:
  - type: web
    name: iyawarin-api
    runtime: docker
    region: singapore
    plan: standard
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/cloud-start.mjs
    healthCheckPath: /api/health
    disk:
      name: iyawarin-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /app/data/hiewly.sqlite
      - key: REQUIRE_EXISTING_DATABASE
        value: "1"
      - key: CLOUD_MIGRATION_PENDING
        value: "1"
      - key: APP_ORIGIN
        value: https://iyawarin.com
      - key: TRUST_PROXY
        value: "1"
      # Use the EXISTING key from the source installation: do not regenerate.
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
